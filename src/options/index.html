<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Options</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="options-panel">
    <h1>Options</h1>
    <section class="option-row">
      <div>
        <h2>Appearance</h2>
        <p id="themeLabel">Dark mode</p>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="false">
        <span id="themeIcon" aria-hidden="true">&#9728;</span>
      </button>
    </section>
    <section class="option-row">
      <div>
        <h2>Logo</h2>
        <div class="logo-name-row">
          <img id="logoPreview" class="logo-thumb" alt="Selected logo preview" hidden />
          <p id="logoLabel">No logo selected</p>
          <button id="logoClear" class="logo-clear" type="button" aria-label="Remove logo" title="Remove logo">&times;</button>
        </div>
      </div>
      <div class="option-actions">
        <button id="logoChoose" class="option-button" type="button">Choose</button>
      </div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
